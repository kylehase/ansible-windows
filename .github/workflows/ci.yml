name: Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ansible-syntax:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible & Collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Validate Master Playbook Syntax
        run: |
          if ! ansible-playbook --syntax-check playbook.yml -i inventory.ini -vvv > err.txt 2>&1; then
            cat err.txt
            MSG=$(tail -n 25 err.txt | tr '\r\n' ' ' | sed 's/[^a-zA-Z0-9 ._:/-]//g' | cut -c 1-500)
            echo "::error title=Ansible Syntax Error::$MSG"
            exit 4
          fi

      - name: Validate Test Playbook Syntax
        run: |
          ansible-playbook --syntax-check tests/verify.yml -i inventory.ini

  powershell-tests:
    name: PowerShell Unit Tests & Lint
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Pester Unit Tests
        shell: powershell
        run: |
          Invoke-Pester -Path ./tests/bootstrap.Tests.ps1
