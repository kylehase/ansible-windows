name: Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ansible-syntax:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Validate Master Playbook Syntax
        id: syntax_master
        continue-on-error: true
        run: |
          ansible-playbook --syntax-check playbook.yml -i inventory.ini -vvv 2>&1 | tee syntax_error.txt

      - name: Upload Syntax Error Log
        uses: actions/upload-artifact@v4
        with:
          name: syntax_error
          path: syntax_error.txt

      - name: Enforce Syntax Pass
        if: steps.syntax_master.outcome != 'success'
        run: exit 1

      - name: Validate Test Playbook Syntax
        run: |
          ansible-playbook --syntax-check tests/verify.yml -i inventory.ini

  powershell-tests:
    name: PowerShell Unit Tests & Lint
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Pester Unit Tests
        shell: powershell
        run: |
          Invoke-Pester -Path ./tests/bootstrap.Tests.ps1
