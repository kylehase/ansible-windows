name: Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ansible-lint-and-syntax:
    name: Ansible Syntax & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible & ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint

      - name: Install Ansible Galaxy collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Validate Master Playbook Syntax
        run: |
          ansible-playbook --syntax-check playbook.yml -i inventory.ini

      - name: Validate Test Playbook Syntax
        run: |
          ansible-playbook --syntax-check tests/verify.yml -i inventory.ini

      - name: Run Ansible Lint
        run: |
          ansible-lint --offline playbook.yml tests/verify.yml || true

  powershell-tests:
    name: PowerShell Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer Linting
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./bootstrap.ps1 -Severity Error,Warning
          if ($results) {
              $results | Format-Table
              exit 1
          } else {
              Write-Host "PSScriptAnalyzer passed with 0 errors or warnings!" -ForegroundColor Green
          }

      - name: Run Pester Unit Tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser
          $res = Invoke-Pester -Path ./tests/bootstrap.Tests.ps1 -PassThru
          if ($res.FailedCount -gt 0) {
              exit 1
          }
