---
- name: Determine packages to install
  ansible.builtin.set_fact:
    target_packages: "{{ ((core_packages + ((install_profile == 'full') | ternary(workstation_packages, [])) + (extra_packages | default([]))) | difference(exclude_packages | default([]))) | unique }}"

- name: Terminate stale installer or package manager processes from prior runs
  ansible.windows.win_powershell:
    script: |
      $stale = @("winget", "Docker Desktop Installer", "Docker Desktop", "com.docker.service", "com.docker.backend", "com.docker.proxy", "dockerd", "vpnkit")
      foreach ($s in $stale) {
          Get-Process -Name $s -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      }
      $Ansible.Changed = $false

- name: Uninstall specified packages if present
  when: (uninstall_packages | default([])) | length > 0
  ansible.windows.win_powershell:
    script: |
      $pkg = "{{ item }}"
      $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
      if (-not $winget) {
          $candidates = @(
              Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\winget.exe",
              "C:\Program Files\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\winget.exe"
          )
          foreach ($c in $candidates) {
              $found = Resolve-Path $c -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $winget = $found.Path; break }
          }
      }
      if (-not $winget -or -not (Test-Path $winget)) { return }

      # Pre-uninstall actions for stubborn applications
      if ($pkg -eq "Docker.DockerDesktop") {
          Stop-Service -Name "com.docker.service" -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.Path -and $_.Path -match "Docker" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "Docker Desktop", "Docker Desktop Installer", "com.docker.service", "com.docker.proxy", "com.docker.backend", "dockerd", "vpnkit" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      }

      $check = & $winget list --id $pkg --exact --accept-source-agreements 2>&1 | Out-String
      $isInstalled = ($LASTEXITCODE -eq 0 -and ($check -match [regex]::Escape($pkg)))

      $dockerInstaller = "C:\Program Files\Docker\Docker\Docker Desktop Installer.exe"
      if ($pkg -eq "Docker.DockerDesktop" -and (Test-Path $dockerInstaller)) {
          $isInstalled = $true
      }

      if ($isInstalled) {
          Write-Host "Uninstalling $pkg..."
          $stdoutFile = [System.IO.Path]::GetTempFileName()
          $stderrFile = [System.IO.Path]::GetTempFileName()
          $timeoutSec = 180

          try {
              if ($pkg -eq "Docker.DockerDesktop" -and (Test-Path $dockerInstaller)) {
                  Write-Host "Running native Docker Desktop uninstaller with 'uninstall --quiet'..."
                  $p = Start-Process -FilePath $dockerInstaller -ArgumentList "uninstall --quiet" -PassThru -NoNewWindow -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
              } else {
                  Write-Host "Running winget uninstall for $pkg..."
                  $uninstallArgs = "uninstall --id `"$pkg`" -e --silent --disable-interactivity --accept-source-agreements"
                  $p = Start-Process -FilePath $winget -ArgumentList $uninstallArgs -PassThru -NoNewWindow -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
              }

              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt $timeoutSec) {
                  Start-Sleep -Seconds 2
              }

              if (-not $p.HasExited) {
                  Write-Warning "Uninstallation of $pkg timed out after $timeoutSec seconds. Terminating process tree..."
                  & taskkill.exe /PID $p.Id /T /F 2>&1 | Out-Null
              }
              $Ansible.Changed = $true
          } finally {
              Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }

          # Post-uninstall cleanup for Docker Desktop
          if ($pkg -eq "Docker.DockerDesktop") {
              Stop-Service -Name "com.docker.service" -Force -ErrorAction SilentlyContinue
              Get-Process -Name "Docker Desktop", "Docker Desktop Installer", "com.docker.service", "com.docker.proxy", "com.docker.backend", "dockerd", "vpnkit" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              & sc.exe delete com.docker.service 2>$null | Out-Null
              $wsl = (Get-Command wsl.exe -ErrorAction SilentlyContinue).Source
              if ($wsl) {
                  & $wsl --unregister docker-desktop 2>$null | Out-Null
                  & $wsl --unregister docker-desktop-data 2>$null | Out-Null
              }
              Remove-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Docker Desktop" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -Path "HKLM:\SOFTWARE\Docker Inc.\Docker Desktop" -Recurse -Force -ErrorAction SilentlyContinue
          }
      } else {
          $Ansible.Changed = $false
      }
  loop: "{{ uninstall_packages | default([]) }}"


- name: Ensure Microsoft .NET Desktop Runtime is installed for dependent applications
  when: "'HandBrake.HandBrake' in target_packages"
  ansible.windows.win_powershell:
    script: |
      $desktopDir = "C:\Program Files\dotnet\shared\Microsoft.WindowsDesktop.App"
      $hasRuntime = (Test-Path $desktopDir) -and (Get-ChildItem -Path $desktopDir -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "10.*" -or $_.Name -like "8.*" -or $_.Name -like "9.*" })
      if ($hasRuntime) {
          $Ansible.Changed = $false
          return
      }

      $tempScript = Join-Path $env:TEMP "dotnet-install.ps1"
      try {
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $tempScript -UseBasicParsing -TimeoutSec 30
          & $tempScript -Runtime windowsdesktop -Channel 10.0 -InstallDir "C:\Program Files\dotnet"
          $Ansible.Changed = $true
      } catch {
          Write-Warning "Failed to install .NET Desktop Runtime via dotnet-install: $_"
          $Ansible.Changed = $false
      } finally {
          Remove-Item -Path $tempScript -Force -ErrorAction SilentlyContinue
      }

- name: Install software via winget
  ansible.windows.win_powershell:
    script: |
      $pkg = "{{ item }}"
      $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
      if (-not $winget) {
          $candidates = @(
              Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\winget.exe",
              "C:\Program Files\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\winget.exe"
          )
          foreach ($c in $candidates) {
              $found = Resolve-Path $c -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $winget = $found.Path; break }
          }
      }
      if (-not $winget) {
          Write-Warning "winget.exe not found on target system."
          return
      }

      $check = & $winget list --id $pkg --exact --accept-source-agreements 2>&1 | Out-String
      if ($LASTEXITCODE -eq 0 -and ($check -match [regex]::Escape($pkg))) {
          $Ansible.Changed = $false
          return
      }

      $stdoutFile = [System.IO.Path]::GetTempFileName()
      $stderrFile = [System.IO.Path]::GetTempFileName()
      $timeoutSec = 240

      try {
          $installArgs = "install --id `"$pkg`" -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity --skip-dependencies"
          $p = Start-Process -FilePath $winget -ArgumentList $installArgs -PassThru -NoNewWindow -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt $timeoutSec) {
              Start-Sleep -Seconds 2
          }

          if (-not $p.HasExited) {
              Write-Warning "Package '$pkg' installation timed out after $timeoutSec seconds. Terminating process tree..."
              & taskkill.exe /PID $p.Id /T /F 2>&1 | Out-Null
              $Ansible.Changed = $false
              return
          }

          $out = Get-Content -Path $stdoutFile, $stderrFile -Raw -ErrorAction SilentlyContinue | Out-String
          if ($p.ExitCode -eq 0 -or $out -match "Successfully installed") {
              $Ansible.Changed = $true
          } else {
              Write-Warning "winget install $pkg finished with exit code $($p.ExitCode). Output: $out"
              $Ansible.Changed = $false
          }
      } finally {
          Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
      }
  loop: "{{ target_packages }}"

- name: Check if Audacity was requested
  ansible.builtin.set_fact:
    audacity_requested: "{{ 'Audacity.Audacity' in target_packages }}"

- name: Install FFmpeg for Audacity if missing
  when: audacity_requested
  block:
    - name: Check if FFmpeg for Audacity is already installed
      ansible.windows.win_stat:
        path: "C:\\Program Files\\FFmpeg for Audacity\\avformat-59.dll"
      register: ffmpeg_installed

    - name: Download and install FFmpeg for Audacity
      when: not ffmpeg_installed.stat.exists
      ansible.windows.win_powershell:
        script: |
          $tempInstaller = Join-Path $env:TEMP "FFmpeg_5.0.0_for_Audacity_x86_64.exe"
          $ffmpegUrl = "https://lame.buanzo.org/FFmpeg_5.0.0_for_Audacity_on_Windows_x86_64.exe"
          $downloadOk = $false
          if (Get-Command curl.exe -ErrorAction SilentlyContinue) {
              & curl.exe -sL -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -H "Referer: https://lame.buanzo.org/ffmpeg.php" -o $tempInstaller $ffmpegUrl
              if ((Test-Path $tempInstaller) -and ((Get-Item $tempInstaller).Length -gt 1000000)) { $downloadOk = $true }
          }
          if (-not $downloadOk) {
              $wc = New-Object System.Net.WebClient
              $wc.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)")
              $wc.Headers.Add("Referer", "https://lame.buanzo.org/ffmpeg.php")
              $wc.DownloadFile($ffmpegUrl, $tempInstaller)
              if ((Test-Path $tempInstaller) -and ((Get-Item $tempInstaller).Length -gt 1000000)) { $downloadOk = $true }
          }
          if ($downloadOk) {
              Start-Process -FilePath $tempInstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
              Remove-Item -Path $tempInstaller -Force -ErrorAction SilentlyContinue
              $Ansible.Changed = $true
          }

- name: Install Lenovo Vantage on Lenovo hardware
  ansible.windows.win_powershell:
    script: |
      $manufacturer = (Get-CimInstance Win32_ComputerSystem).Manufacturer
      if ($manufacturer -match "Lenovo") {
          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
          if (-not $winget) { $winget = "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe" }
          $check = & $winget list --id 9WZDNCRFJ4MV --exact --accept-source-agreements 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -and ($check -match "9WZDNCRFJ4MV")) {
              $Ansible.Changed = $false
              return
          }

          $stdoutFile = [System.IO.Path]::GetTempFileName()
          $stderrFile = [System.IO.Path]::GetTempFileName()
          $timeoutSec = 300

          try {
              $p = Start-Process -FilePath $winget -ArgumentList "install --id 9WZDNCRFJ4MV -s msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity" -PassThru -NoNewWindow -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt $timeoutSec) {
                  Start-Sleep -Seconds 2
              }
              if (-not $p.HasExited) {
                  Write-Warning "Lenovo Vantage install timed out after $timeoutSec seconds. Terminating..."
                  & taskkill.exe /PID $p.Id /T /F 2>&1 | Out-Null
                  $Ansible.Changed = $false
              } else {
                  $Ansible.Changed = $true
              }
          } finally {
              Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }
      }

- name: Configure UniGetUI background auto-updates, pinning, and startup daemon
  when: "'Devolutions.UniGetUI' in target_packages"
  ansible.windows.win_powershell:
    script: |
      $changed = $false
      $unigetConfigDir = Join-Path $env:LOCALAPPDATA "UniGetUI\Configuration"
      if (-not (Test-Path $unigetConfigDir)) { New-Item -ItemType Directory -Path $unigetConfigDir -Force | Out-Null; $changed = $true }

      $autoUp = Join-Path $unigetConfigDir "AutomaticallyUpdatePackages"
      if (-not (Test-Path $autoUp)) { Set-Content -Path $autoUp -Value "" -Force; $changed = $true }

      $intervalFile = Join-Path $unigetConfigDir "UpdatesCheckInterval"
      $curInterval = if (Test-Path $intervalFile) { (Get-Content -Path $intervalFile -Raw).Trim() } else { "" }
      if ($curInterval -ne "14400") { Set-Content -Path $intervalFile -Value "14400" -Force; $changed = $true }

      $cacheAdmin = Join-Path $unigetConfigDir "DoCacheAdminRights"
      if (-not (Test-Path $cacheAdmin)) { Set-Content -Path $cacheAdmin -Value "" -Force; $changed = $true }

      # Ignore self-updating apps
      $ignoredFile = Join-Path $unigetConfigDir "IgnoredPackageUpdates.json"
      $ignoredMap = @{}
      if (Test-Path $ignoredFile) {
          try {
              $existing = Get-Content $ignoredFile -Raw | ConvertFrom-Json
              if ($existing) { foreach ($p in $existing.PSObject.Properties) { $ignoredMap[$p.Name] = $p.Value } }
          } catch {}
      }
      $beforeJson = $ignoredMap | ConvertTo-Json -Depth 5
      foreach ($app in @("winget\Google.Chrome", "winget\Google.ChromeRemoteDesktopHost", "winget\Brave.Brave", "winget\Mozilla.Firefox")) {
          $ignoredMap[$app] = "*"
      }
      $newJson = $ignoredMap | ConvertTo-Json -Depth 5
      if ($beforeJson -ne $newJson -or -not (Test-Path $ignoredFile)) {
          Set-Content -Path $ignoredFile -Value $newJson -Force
          Set-Content -Path (Join-Path $env:LOCALAPPDATA "UniGetUI\IgnoredPackageUpdates.json") -Value $newJson -Force
          $changed = $true
      }

      # Pin self-updating packages in winget CLI
      $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
      if (-not $winget) { $winget = "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe" }
      if ($winget -and (Test-Path $winget)) {
          $pins = & $winget pin list --accept-source-agreements 2>&1 | Out-String
          foreach ($pId in @("Google.Chrome", "Google.ChromeRemoteDesktopHost")) {
              if ($pins -notmatch [regex]::Escape($pId)) {
                  & $winget pin add --id $pId --blocking --accept-source-agreements 2>$null | Out-Null
                  $changed = $true
              }
          }
      }

      # Configure startup daemon
      $unigetExe = Join-Path $env:LOCALAPPDATA "Programs\UniGetUI\UniGetUI.exe"
      if (Test-Path $unigetExe) {
          $curRun = (Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "UniGetUI" -ErrorAction SilentlyContinue).UniGetUI
          $targetRun = "`"$unigetExe`" --daemon"
          if ($curRun -ne $targetRun) {
              Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "UniGetUI" -Value $targetRun -Force
              $changed = $true
          }
      }
      $Ansible.Changed = $changed

- name: Setup Canon DR-P208II scanner suite
  when: (install_profile == 'full') and (enable_canon_scanner | default(false) | bool)
  ansible.builtin.include_tasks: canon_scanner.yml
