---
- name: Determine packages to install
  ansible.builtin.set_fact:
    target_packages: "{{ core_packages + ((install_profile == 'full') | ternary(workstation_packages, [])) }}"

- name: Install software via winget
  ansible.windows.win_powershell:
    script: |
      $pkg = "{{ item }}"
      $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
      if (-not $winget) {
          $candidates = @(
              Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\winget.exe",
              "C:\Program Files\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\winget.exe"
          )
          foreach ($c in $candidates) {
              $found = Resolve-Path $c -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $winget = $found.Path; break }
          }
      }
      if (-not $winget) {
          Write-Warning "winget.exe not found on target system."
          return
      }

      $check = & $winget list --id $pkg --exact --accept-source-agreements 2>&1 | Out-String
      if ($LASTEXITCODE -eq 0 -and ($check -match [regex]::Escape($pkg))) {
          $Ansible.Changed = $false
          return
      }

      $out = & $winget install --id $pkg -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity 2>&1 | Out-String
      if ($out -match "Successfully installed" -or $LASTEXITCODE -eq 0) {
          $Ansible.Changed = $true
      } else {
          Write-Warning "winget install $pkg returned exit code $LASTEXITCODE"
      }
  loop: "{{ target_packages }}"

- name: Check if Audacity was requested
  ansible.builtin.set_fact:
    audacity_requested: "{{ 'Audacity.Audacity' in target_packages }}"

- name: Install FFmpeg for Audacity if missing
  when: audacity_requested
  block:
    - name: Check if FFmpeg for Audacity is already installed
      ansible.windows.win_stat:
        path: "C:\\Program Files\\FFmpeg for Audacity\\avformat-59.dll"
      register: ffmpeg_installed

    - name: Download and install FFmpeg for Audacity
      when: not ffmpeg_installed.stat.exists
      ansible.windows.win_powershell:
        script: |
          $tempInstaller = Join-Path $env:TEMP "FFmpeg_5.0.0_for_Audacity_x86_64.exe"
          $ffmpegUrl = "https://lame.buanzo.org/FFmpeg_5.0.0_for_Audacity_on_Windows_x86_64.exe"
          $downloadOk = $false
          if (Get-Command curl.exe -ErrorAction SilentlyContinue) {
              & curl.exe -sL -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -H "Referer: https://lame.buanzo.org/ffmpeg.php" -o $tempInstaller $ffmpegUrl
              if ((Test-Path $tempInstaller) -and ((Get-Item $tempInstaller).Length -gt 1000000)) { $downloadOk = $true }
          }
          if (-not $downloadOk) {
              $wc = New-Object System.Net.WebClient
              $wc.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)")
              $wc.Headers.Add("Referer", "https://lame.buanzo.org/ffmpeg.php")
              $wc.DownloadFile($ffmpegUrl, $tempInstaller)
              if ((Test-Path $tempInstaller) -and ((Get-Item $tempInstaller).Length -gt 1000000)) { $downloadOk = $true }
          }
          if ($downloadOk) {
              Start-Process -FilePath $tempInstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
              Remove-Item -Path $tempInstaller -Force -ErrorAction SilentlyContinue
              $Ansible.Changed = $true
          }

- name: Install Lenovo Vantage on Lenovo hardware
  ansible.windows.win_powershell:
    script: |
      $manufacturer = (Get-CimInstance Win32_ComputerSystem).Manufacturer
      if ($manufacturer -match "Lenovo") {
          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
          if (-not $winget) { $winget = "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe" }
          $check = & $winget list --id 9WZDNCRFJ4MV --exact --accept-source-agreements 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -and ($check -match "9WZDNCRFJ4MV")) {
              $Ansible.Changed = $false
              return
          }
          & $winget install --id 9WZDNCRFJ4MV -s msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity 2>&1 | Out-Null
          $Ansible.Changed = $true
      }

- name: Configure UniGetUI background auto-updates, pinning, and startup daemon
  when: "'Devolutions.UniGetUI' in target_packages"
  ansible.windows.win_powershell:
    script: |
      $unigetConfigDir = Join-Path $env:LOCALAPPDATA "UniGetUI\Configuration"
      if (-not (Test-Path $unigetConfigDir)) { New-Item -ItemType Directory -Path $unigetConfigDir -Force | Out-Null }
      Set-Content -Path (Join-Path $unigetConfigDir "AutomaticallyUpdatePackages") -Value "" -Force
      Set-Content -Path (Join-Path $unigetConfigDir "UpdatesCheckInterval") -Value "14400" -Force
      Set-Content -Path (Join-Path $unigetConfigDir "DoCacheAdminRights") -Value "" -Force

      # Ignore self-updating apps
      $ignoredFile = Join-Path $unigetConfigDir "IgnoredPackageUpdates.json"
      $ignoredMap = @{}
      if (Test-Path $ignoredFile) {
          try {
              $existing = Get-Content $ignoredFile -Raw | ConvertFrom-Json
              if ($existing) { foreach ($p in $existing.PSObject.Properties) { $ignoredMap[$p.Name] = $p.Value } }
          } catch {}
      }
      foreach ($app in @("winget\Google.Chrome", "winget\Google.ChromeRemoteDesktopHost", "winget\Brave.Brave", "winget\Mozilla.Firefox")) {
          $ignoredMap[$app] = "*"
      }
      $json = $ignoredMap | ConvertTo-Json -Depth 5
      Set-Content -Path $ignoredFile -Value $json -Force
      Set-Content -Path (Join-Path $env:LOCALAPPDATA "UniGetUI\IgnoredPackageUpdates.json") -Value $json -Force

      # Pin self-updating packages in winget CLI
      $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
      if (-not $winget) { $winget = "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe" }
      foreach ($pId in @("Google.Chrome", "Google.ChromeRemoteDesktopHost")) {
          & $winget pin add --id $pId --blocking --accept-source-agreements 2>$null | Out-Null
      }

      # Configure startup daemon
      $unigetExe = Join-Path $env:LOCALAPPDATA "Programs\UniGetUI\UniGetUI.exe"
      if (Test-Path $unigetExe) {
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "UniGetUI" -Value "`"$unigetExe`" --daemon" -Force
      }
      $Ansible.Changed = $true

- name: Setup Canon DR-P208II scanner suite
  when: install_profile == 'full'
  ansible.builtin.include_tasks: canon_scanner.yml
