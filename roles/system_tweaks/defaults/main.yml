---
# Default settings for system_tweaks role

# Touchpad 2-finger scroll direction:
# 0 = Down motion scrolls up (Windows default / natural)
# 4294967295 = Down motion scrolls down (traditional PC style)
touchpad_scroll_direction: 4294967295

# Display scaling percentage (e.g. 100, 125, 150, 175, 200, 225, 250, 300)
# null leaves the system default / per-monitor setting untouched
display_scaling: null

# Network Printer Configuration (Brother HL-L3230CDW)
enable_network_printer: true
printer_ip: "192.168.50.5"
printer_name: "Brother HL-L3230CDW"
printer_driver: "Brother Laser Type1 Class Driver"

