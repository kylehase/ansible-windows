---
- name: Enable automatic timezone update service
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\tzautoupdate
    name: Start
    data: 3
    type: dword

- name: Enable and start Windows Time service (W32Time)
  ansible.windows.win_service:
    name: W32Time
    start_mode: auto
    state: started

- name: Trigger time resynchronization
  ansible.windows.win_command: w32tm /resync
  failed_when: false
  changed_when: false

- name: Configure ISO date and 24-hour time format
  ansible.windows.win_regedit:
    path: HKCU:\Control Panel\International
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: string
  loop:
    - { name: "sShortDate", data: "yyyy-MM-dd" }
    - { name: "sLongDate", data: "dddd, MMMM d" }
    - { name: "sShortTime", data: "HH:mm" }
    - { name: "sTimeFormat", data: "HH:mm:ss" }

- name: Configure Touchpad 2-finger scroll direction
  ansible.windows.win_regedit:
    path: HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\PrecisionTouchPad
    name: ScrollDirection
    data: "{{ touchpad_scroll_direction }}"
    type: dword

- name: Disable touchpad lower right corner right click zone
  ansible.windows.win_regedit:
    path: HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\PrecisionTouchPad
    name: RightClickZoneEnabled
    data: 0
    type: dword

- name: Set standard Windows default zip icon
  ansible.windows.win_regedit:
    path: "{{ item }}"
    name: "(Default)"
    data: "C:\\Windows\\system32\\zipfldr.dll"
    type: string
  loop:
    - HKCR:\WinRAR.ZIP\DefaultIcon
    - HKCR:\zipfile\DefaultIcon
    - HKCU:\Software\Classes\WinRAR.ZIP\DefaultIcon
    - HKCU:\Software\Classes\zipfile\DefaultIcon

- name: Configure .zip open action to use winrar-extract.vbs
  ansible.windows.win_regedit:
    path: "{{ item }}"
    name: "(Default)"
    data: 'wscript.exe "%USERPROFILE%\Tools\winrar-extract.vbs" "%1"'
    type: string
  loop:
    - HKCR:\WinRAR.ZIP\shell\open\command
    - HKCR:\zipfile\shell\open\command
    - HKCU:\Software\Classes\WinRAR.ZIP\shell\open\command
    - HKCU:\Software\Classes\zipfile\shell\open\command

- name: Copy custom IntegratedServicesRegionPolicySet.json to staging
  ansible.windows.win_copy:
    src: IntegratedServicesRegionPolicySet.json
    dest: "C:\\Users\\{{ ansible_user }}\\AppData\\Local\\Temp\\IntegratedServicesRegionPolicySet.json"

- name: Take ownership and deploy IntegratedServicesRegionPolicySet.json to System32
  ansible.windows.win_powershell:
    script: |
      $staging = "C:\Users\$($env:USERNAME)\AppData\Local\Temp\IntegratedServicesRegionPolicySet.json"
      $target = "C:\Windows\System32\IntegratedServicesRegionPolicySet.json"
      $backup = "C:\Windows\System32\IntegratedServicesRegionPolicySet.json.bak"

      if (-not (Test-Path $staging)) {
          Write-Error "Staged policy file not found at $staging"
          return
      }

      if (Test-Path $target) {
          $srcHash = (Get-FileHash -Path $staging -Algorithm SHA256).Hash
          $tgtHash = (Get-FileHash -Path $target -Algorithm SHA256).Hash
          if ($srcHash -eq $tgtHash) {
              $Ansible.Changed = $false
              Remove-Item $staging -Force -ErrorAction SilentlyContinue
              return
          }

          takeown.exe /F $target /A | Out-Null
          icacls.exe $target /grant "*S-1-5-32-544:F" | Out-Null
          icacls.exe $target /grant "*S-1-5-32-545:F" | Out-Null
          if (-not (Test-Path $backup)) {
              Copy-Item -Path $target -Destination $backup -Force
          }
      }

      Copy-Item -Path $staging -Destination $target -Force
      Remove-Item $staging -Force -ErrorAction SilentlyContinue
      $Ansible.Changed = $true

- name: Deploy Dell S3422DWG monitor ICC profile
  when: apply_dell_icc_profile | default(false) | bool
  ansible.windows.win_copy:
    src: "DELL S3422DWG-832A0579-2AF9-E14F-D6CF-8306B0B75FE9.icc"
    dest: "C:\\Windows\\System32\\spool\\drivers\\color\\DELL S3422DWG-832A0579-2AF9-E14F-D6CF-8306B0B75FE9.icc"

- name: Deploy Desktop Wallpaper
  ansible.windows.win_copy:
    src: "Andor Death Star.png"
    dest: "C:\\Users\\{{ ansible_user }}\\Pictures\\Andor Death Star.png"

- name: Apply Desktop Wallpaper
  ansible.windows.win_powershell:
    script: |
      $wallPath = "C:\Users\$($env:USERNAME)\Pictures\Andor Death Star.png"
      if (-not (Test-Path $wallPath)) {
          $wallPath = "C:\Users\$($env:USERNAME)\Pictures\AndorDeathStar.png"
      }
      if (-not (Test-Path $wallPath)) {
          Write-Warning "Wallpaper file not found at $wallPath"
          $Ansible.Changed = $false
          return
      }

      # Pre-check: if already configured and cache file matches hash, do nothing
      $regWall = (Get-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name Wallpaper -ErrorAction SilentlyContinue).Wallpaper
      $regStyle = (Get-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name WallpaperStyle -ErrorAction SilentlyContinue).WallpaperStyle
      $themesDir = Join-Path $env:APPDATA "Microsoft\Windows\Themes"
      $transcoded = Join-Path $themesDir "TranscodedWallpaper"

      $alreadyApplied = ($regWall -eq $wallPath) -and ($regStyle -eq "10")
      if ($alreadyApplied -and (Test-Path $transcoded)) {
          $targetHash = (Get-FileHash -Path $wallPath -Algorithm SHA256).Hash
          $currHash = (Get-FileHash -Path $transcoded -Algorithm SHA256).Hash
          if ($targetHash -eq $currHash) {
              $Ansible.Changed = $false
              return
          }
      }

      # 1. Update HKCU Control Panel\Desktop Registry values
      Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name Wallpaper -Value $wallPath -Type String -Force
      Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name WallpaperStyle -Value "10" -Type String -Force
      Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name TileWallpaper -Value "0" -Type String -Force

      # 2. Update Explorer BackgroundHistoryPath
      $historyKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers"
      if (-not (Test-Path $historyKey)) { New-Item -Path $historyKey -Force | Out-Null }
      Set-ItemProperty -Path $historyKey -Name "BackgroundHistoryPath0" -Value $wallPath -Type String -Force

      # 3. Directly overwrite TranscodedWallpaper in Themes directory (the cache Windows shell renders)
      if (-not (Test-Path $themesDir)) { New-Item -ItemType Directory -Path $themesDir -Force | Out-Null }
      Copy-Item -Path $wallPath -Destination $transcoded -Force

      # Clean up CachedFiles so Explorer does not reuse old cached images
      $cachedDir = Join-Path $themesDir "CachedFiles"
      if (Test-Path $cachedDir) {
          Remove-Item -Path "$cachedDir\*" -Force -ErrorAction SilentlyContinue
      }

      # 4. Invoke Win32 SystemParametersInfo in current session if possible
      try {
          if (-not ([System.Management.Automation.PSTypeName]'Win32WallpaperHelper').Type) {
              $def = 'using System; using System.Runtime.InteropServices; public class Win32WallpaperHelper { [DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }'
              Add-Type -TypeDefinition $def -ErrorAction SilentlyContinue
          }
          [Win32WallpaperHelper]::SystemParametersInfo(0x0014, 0, $wallPath, 0x0001 -bor 0x0002) | Out-Null
      } catch {}

      # 5. Launch an interactive Scheduled Task to cross the Session 0 boundary into the active user desktop
      try {
          $taskName = "ApplyWallpaperInteractive"
          $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -Command `"Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class W { [DllImport(\`"user32.dll\`")] public static extern int SystemParametersInfo(int a, int b, string c, int d); }'; [W]::SystemParametersInfo(0x0014, 0, '$wallPath', 3); RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True`""
          $principal = New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType Interactive
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 1)
          Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings -Force | Out-Null
          Start-ScheduledTask -TaskName $taskName | Out-Null
          Start-Sleep -Seconds 2
          Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
      } catch {}

      # 6. Restart explorer.exe if currently running to force instant visual reload
      $exp = Get-Process -Name explorer -ErrorAction SilentlyContinue
      if ($exp) {
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
      }

      # 7. Configure RunOnce to guarantee application upon any fresh interactive logon
      Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\RunOnce" -Name "ApplyWallpaper" -Value "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command `"Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class W { [DllImport(\`"user32.dll\`")] public static extern int SystemParametersInfo(int a, int b, string c, int d); }'; [W]::SystemParametersInfo(0x0014, 0, '$wallPath', 3); RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True`"" -Force

      $Ansible.Changed = $true


- name: Create Network Location Shortcuts (This PC)
  ansible.windows.win_powershell:
    script: |
      $changed = $false
      $netHood = [Environment]::GetFolderPath("NetworkShortcuts")
      if ($netHood -and (Test-Path $netHood)) {
          $wsh = New-Object -ComObject WScript.Shell
          $shares = @{
              "Public (abyss)"    = "\\abyss\Public"
              "Media (abyss)"     = "\\abyss\Media"
              "Downloads (abyss)" = "\\abyss\Downloads"
          }
          foreach ($key in $shares.Keys) {
              $lnk = Join-Path $netHood "$key.lnk"
              if (-not (Test-Path $lnk)) {
                  $sc = $wsh.CreateShortcut($lnk)
                  $sc.TargetPath = $shares[$key]
                  $sc.Save()
                  $changed = $true
              }
          }
      }
      $Ansible.Changed = $changed

- name: Ensure Tools directory exists
  when: display_scaling is defined and display_scaling is not none
  ansible.windows.win_file:
    path: "C:\\Users\\{{ ansible_user }}\\Tools"
    state: directory

- name: Deploy SetDpi utility
  when: display_scaling is defined and display_scaling is not none
  ansible.windows.win_copy:
    src: SetDpi.exe
    dest: "C:\\Users\\{{ ansible_user }}\\Tools\\SetDpi.exe"

- name: Configure Display Scaling registry settings
  when: display_scaling is defined and display_scaling is not none
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: "{{ item.type }}"
  loop:
    - path: HKCU:\Control Panel\Desktop
      name: LogPixels
      data: "{{ (display_scaling | int * 96 / 100) | round | int }}"
      type: dword
    - path: HKCU:\Control Panel\Desktop
      name: Win8DpiScaling
      data: 1
      type: dword
    - path: HKCU:\Control Panel\Desktop\PerMonitorSettings
      name: DpiValue
      data: 4294967295
      type: dword
    - path: HKCU:\Software\Microsoft\Windows\CurrentVersion\RunOnce
      name: SetDpiScaling
      data: '"C:\Users\{{ ansible_user }}\Tools\SetDpi.exe" {{ display_scaling }}'
      type: string

- name: Apply Display Scaling immediately via SetDpi
  when: display_scaling is defined and display_scaling is not none
  ansible.windows.win_powershell:
    script: |
      $tool = "C:\Users\$($env:USERNAME)\Tools\SetDpi.exe"
      $targetScale = [int]"{{ display_scaling }}"
      if (Test-Path $tool) {
          $curr = (& $tool value 2>&1) | Out-String
          if ($curr.Trim() -eq "$targetScale") {
              $Ansible.Changed = $false
              return
          }
          & $tool $targetScale 2>&1 | Out-String
          $Ansible.Changed = $true
      }
  failed_when: false

- name: Clean Desktop icons (keep Recycle Bin and Google Chrome)
  ansible.builtin.include_tasks: desktop_icons.yml

