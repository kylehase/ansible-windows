---
- name: Configure Network Printer and Standard TCP/IP Port
  ansible.windows.win_powershell:
    script: |
      $changed = $false
      $printerName = "{{ printer_name }}"
      $printerIp = "{{ printer_ip }}"
      $portName = "IP_$printerIp"
      $targetDriver = "{{ printer_driver | default('Brother Laser Type1 Class Driver') }}"

      # 1. Clean up accidental or duplicate queue if present
      $oldPrinters = @("Brother HL-L3230CDW series Printer")
      foreach ($old in $oldPrinters) {
          if ($old -ne $printerName) {
              $p = Get-Printer -Name $old -ErrorAction SilentlyContinue
              if ($p) {
                  Remove-Printer -Name $old -ErrorAction SilentlyContinue
                  $changed = $true
              }
          }
      }

      # 2. Ensure Standard TCP/IP Port exists
      $port = Get-PrinterPort -Name $portName -ErrorAction SilentlyContinue
      if (-not $port) {
          Add-PrinterPort -Name $portName -PrinterHostAddress $printerIp -ErrorAction Stop
          $changed = $true
      }

      # 3. Resolve preferred driver (Brother Laser Type1 Class Driver with fallback to Microsoft IPP Class Driver)
      $availDriver = Get-PrinterDriver -Name $targetDriver -ErrorAction SilentlyContinue
      $driverToUse = if ($availDriver) { $targetDriver } else { "Microsoft IPP Class Driver" }

      # 4. Ensure Printer exists and is bound to the static IP port
      $printer = Get-Printer -Name $printerName -ErrorAction SilentlyContinue
      if (-not $printer) {
          Add-Printer -Name $printerName -DriverName $driverToUse -PortName $portName -ErrorAction Stop
          $changed = $true
      } else {
          if ($printer.PortName -ne $portName) {
              Set-Printer -Name $printerName -PortName $portName -ErrorAction Stop
              $changed = $true
          }
          if ($printer.DriverName -ne $driverToUse -and $availDriver) {
              Set-Printer -Name $printerName -DriverName $driverToUse -ErrorAction Stop
              $changed = $true
          }
      }

      $Ansible.Changed = $changed
