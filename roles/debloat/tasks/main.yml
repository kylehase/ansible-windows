---
# ---------------------------------------------------------
# Telemetry & Diagnostics
# ---------------------------------------------------------
- name: Disable Windows Telemetry via Policy
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection
    name: AllowTelemetry
    data: 0
    type: dword

- name: Disable Telemetry and Diagnostic Services
  ansible.windows.win_service:
    name: "{{ item }}"
    start_mode: disabled
    state: stopped
  loop:
    - DiagTrack
    - dmwappushservice
  failed_when: false

- name: Disable Windows Advertising ID
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo
    name: Enabled
    data: 0
    type: dword

- name: Disable Diagnostic Tailored Experiences
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Privacy
    name: TailoredExperiencesWithDiagnosticDataEnabled
    data: 0
    type: dword

- name: Disable Lock Screen Suggestions, Promos, and Content Delivery
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
    name: "{{ item }}"
    data: 0
    type: dword
  loop:
    - SubscribedContent-338387Enabled
    - RotatingLockScreenOverlayEnabled
    - SoftLandingEnabled
    - SystemPaneSuggestionsEnabled

# ---------------------------------------------------------
# Start Menu & Search Tweaks
# ---------------------------------------------------------
- name: Disable Bing web results in Start Menu search
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - { path: "HKCU:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer", name: "DisableSearchBoxSuggestions", data: 1 }
    - { path: "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search", name: "BingSearchEnabled", data: 0 }
    - { path: "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search", name: "ConnectedSearchUseWeb", data: 0 }

- name: Hide Search bar on Taskbar
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Search
    name: SearchboxTaskbarMode
    data: 0
    type: dword

- name: Disable User Choice Protection Driver (UCPD) service
  ansible.windows.win_powershell:
    script: |
      $changed = $false
      $svc = Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\UCPD" -ErrorAction SilentlyContinue
      if ($svc -and $svc.Start -ne 4) {
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\UCPD" -Name "Start" -Value 4 -Type DWord -Force -ErrorAction SilentlyContinue
          $changed = $true
      }
      $Ansible.Changed = $changed
  failed_when: false

- name: Remove Windows Web Experience Pack (Taskbar Widgets)
  ansible.windows.win_powershell:
    script: |
      $changed = $false
      $prov = @(Get-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*WebExperience*" -or $_.DisplayName -like "*WidgetsPlatformRuntime*" })
      foreach ($p in $prov) {
          Remove-AppxProvisionedPackage -Online -PackageName $p.PackageName -ErrorAction SilentlyContinue | Out-Null
          $changed = $true
      }
      $pkgs = @(Get-AppxPackage -Name "*WebExperience*" -AllUsers -ErrorAction SilentlyContinue)
      if ($pkgs.Count -eq 0) {
          $pkgs = @(Get-AppxPackage -Name "*WebExperience*" -ErrorAction SilentlyContinue)
      }
      foreach ($u in $pkgs) {
          Remove-AppxPackage -Package $u.PackageFullName -AllUsers -ErrorAction SilentlyContinue | Out-Null
          $changed = $true
      }
      $Ansible.Changed = $changed

- name: Configure Taskbar Widgets registry settings
  ansible.windows.win_powershell:
    script: |
      $changed = $false
      try {
          $dshKey = "HKLM:\SOFTWARE\Policies\Microsoft\Dsh"
          if (-not (Test-Path $dshKey)) { New-Item -Path $dshKey -Force -ErrorAction SilentlyContinue | Out-Null }
          $curr = (Get-ItemProperty -Path $dshKey -Name "AllowNewsAndInterests" -ErrorAction SilentlyContinue).AllowNewsAndInterests
          if ($curr -ne 0) {
              Set-ItemProperty -Path $dshKey -Name "AllowNewsAndInterests" -Value 0 -Type DWord -Force -ErrorAction Stop
              $changed = $true
          }
      } catch {}

      try {
          $advKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
          $curr = (Get-ItemProperty -Path $advKey -Name "TaskbarDa" -ErrorAction SilentlyContinue).TaskbarDa
          if ($curr -ne 0) {
              Set-ItemProperty -Path $advKey -Name "TaskbarDa" -Value 0 -Type DWord -Force -ErrorAction Stop
              $changed = $true
          }
      } catch {}

      $Ansible.Changed = $changed
  failed_when: false

- name: Prevent Microsoft Store from pinning to Taskbar
  ansible.windows.win_regedit:
    path: "{{ item }}"
    name: NoPinningStoreToTaskbar
    data: 1
    type: dword
  loop:
    - HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer
    - HKCU:\Software\Policies\Microsoft\Windows\Explorer
  failed_when: false

- name: Ensure Shell directories exist for LayoutModification
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "C:\\Users\\Default\\AppData\\Local\\Microsoft\\Windows\\Shell"
    - "C:\\Users\\{{ ansible_user }}\\AppData\\Local\\Microsoft\\Windows\\Shell"

- name: Deploy clean Taskbar LayoutModification template
  ansible.windows.win_copy:
    src: LayoutModification.xml
    dest: "{{ item }}\\LayoutModification.xml"
  loop:
    - "C:\\Users\\Default\\AppData\\Local\\Microsoft\\Windows\\Shell"
    - "C:\\Users\\{{ ansible_user }}\\AppData\\Local\\Microsoft\\Windows\\Shell"

- name: Configure desired Taskbar pins and unpin Edge and Store
  ansible.windows.win_powershell:
    script: |
      $def = @'
      using System;
      using System.Text;
      using System.Runtime.InteropServices;
      public class ShellStringHelper {
          [DllImport("kernel32.dll", CharSet = CharSet.Auto)]
          public static extern IntPtr GetModuleHandle(string lpModuleName);
          [DllImport("user32.dll", CharSet = CharSet.Auto)]
          public static extern int LoadString(IntPtr hInstance, uint uID, StringBuilder lpBuffer, int nBufferMax);
          public static string GetString(uint strId) {
              IntPtr hModule = GetModuleHandle("shell32.dll");
              StringBuilder sb = new StringBuilder(256);
              LoadString(hModule, strId, sb, sb.Capacity);
              return sb.ToString();
          }
      }
      '@
      if (-not ([System.Management.Automation.PSTypeName]'ShellStringHelper').Type) {
          Add-Type -TypeDefinition $def -ErrorAction SilentlyContinue
      }

      $unpinVerbStr = ""
      try {
          $unpinVerbStr = [ShellStringHelper]::GetString(5387)
      } catch {}

      $unpinTargets = @("Microsoft Edge", "Microsoft Store", "Edge", "Store")
      $changed = $false

      $taskbarDir = Join-Path $env:APPDATA "Microsoft\Internet Explorer\Quick Launch\User Pinned\TaskBar"
      if (-not (Test-Path $taskbarDir)) {
          New-Item -ItemType Directory -Path $taskbarDir -Force | Out-Null
      }

      # 1. Remove unwanted pinned shortcuts (Edge, Store)
      $unwantedLinks = Get-ChildItem -Path $taskbarDir -Filter "*.lnk" -ErrorAction SilentlyContinue |
          Where-Object {
              $base = $_.BaseName
              ($base -like "*Edge*" -or $base -like "*Store*")
          }
      foreach ($lnk in $unwantedLinks) {
          Remove-Item -Path $lnk.FullName -Force -ErrorAction SilentlyContinue
          $changed = $true
      }

      # 2. Invoke Shell COM unpin verb on any active Edge or Store pins
      $shell = New-Object -ComObject Shell.Application
      $folder = $shell.NameSpace('shell:::{4234d49b-0245-4df3-b780-3893943456e1}')
      if ($folder) {
          foreach ($item in $folder.Items()) {
              $name = $item.Name
              $isUnpinTarget = $false
              foreach ($t in $unpinTargets) {
                  if ($name -like "*$t*") {
                      $isUnpinTarget = $true
                      break
                  }
              }
              if ($isUnpinTarget) {
                  foreach ($verb in $item.Verbs()) {
                      $cleanVerb = ($verb.Name -replace '&', '').Trim()
                      if (($unpinVerbStr -and $verb.Name -eq $unpinVerbStr) -or $cleanVerb -eq 'Unpin from taskbar') {
                          $verb.DoIt()
                          $changed = $true
                          break
                      }
                  }
              }
          }
      }

      # 3. Ensure required shortcuts exist in User Pinned\TaskBar (File Explorer, Chrome, PowerShell)
      $wsh = New-Object -ComObject WScript.Shell
      $desiredPins = @(
          @{
              Name = "File Explorer.lnk"
              Sources = @(
                  Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\File Explorer.lnk",
                  "C:\Users\Default\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\File Explorer.lnk"
              )
              Target = "explorer.exe"
          },
          @{
              Name = "Google Chrome.lnk"
              Sources = @(
                  Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\Google Chrome.lnk"
              )
              Target = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          },
          @{
              Name = "Windows PowerShell.lnk"
              Sources = @(
                  Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Windows PowerShell\Windows PowerShell.lnk",
                  "C:\Users\Default\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Windows PowerShell\Windows PowerShell.lnk"
              )
              Target = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          }
      )

      $needsTaskbarRefresh = $false
      foreach ($pin in $desiredPins) {
          $dest = Join-Path $taskbarDir $pin.Name
          if (-not (Test-Path $dest)) {
              $copied = $false
              foreach ($src in $pin.Sources) {
                  if (Test-Path $src) {
                      Copy-Item -Path $src -Destination $dest -Force
                      $copied = $true
                      $changed = $true
                      $needsTaskbarRefresh = $true
                      break
                  }
              }
              if (-not $copied -and (Test-Path $pin.Target)) {
                  $sc = $wsh.CreateShortcut($dest)
                  $sc.TargetPath = $pin.Target
                  $sc.Save()
                  $changed = $true
                  $needsTaskbarRefresh = $true
              }
          }
      }

      # 4. If pins were changed or restored, refresh Taskband and trigger Explorer reload
      if ($needsTaskbarRefresh -or $changed) {
          try {
              $tbKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Taskband"
              if (Test-Path $tbKey) {
                  Remove-ItemProperty -Path $tbKey -Name "Favorites", "FavoritesResolve", "FavoritesChanges", "FavoritesRemovedChanges", "FavoritesVersion" -ErrorAction SilentlyContinue
              }
          } catch {}

          try {
              $taskName = "RefreshTaskbarInteractive"
              $cmd = 'Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue'
              $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -Command `"$cmd`""
              $principal = New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType Interactive
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 1)
              Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings -Force | Out-Null
              Start-ScheduledTask -TaskName $taskName | Out-Null
              Start-Sleep -Seconds 2
              Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          } catch {}
      }

      $Ansible.Changed = $changed

- name: Disable Lockscreen tips and advertisements
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
    name: "{{ item }}"
    data: 0
    type: dword
  loop:
    - RotatingLockScreenOverlayEnabled
    - SubscribedContent-338387Enabled

# ---------------------------------------------------------
# Explorer & UI Enhancements
# ---------------------------------------------------------
- name: Always show known file extensions in File Explorer
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    name: HideFileExt
    data: 0
    type: dword

- name: Restore classic Windows 10 full context menu
  ansible.windows.win_regedit:
    path: HKCU:\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32
    name: "(Default)"
    data: ""
    type: string

- name: Disable Windows Copilot
  ansible.windows.win_regedit:
    path: "{{ item }}"
    name: TurnOffWindowsCopilot
    data: 1
    type: dword
  loop:
    - HKCU:\Software\Policies\Microsoft\Windows\WindowsCopilot
    - HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot

- name: Disable Xbox background services
  ansible.windows.win_service:
    name: "{{ item }}"
    start_mode: disabled
    state: stopped
  loop:
    - XblAuthManager
    - XblGameSave
    - XboxGipSvc
    - XboxNetApiSvc
  failed_when: false

# ---------------------------------------------------------
# Win11Debloat Tool Execution
# ---------------------------------------------------------
- name: Ensure Win11Debloat staging directory exists
  ansible.windows.win_file:
    path: "C:\\Temp\\Debloat"
    state: directory

- name: Deploy Win11Debloat suite archive and configuration
  ansible.windows.win_copy:
    src: "{{ item }}"
    dest: "C:\\Temp\\Debloat\\{{ item }}"
  loop:
    - Win11Debloat.zip
    - CustomDebloatConfig.json
    - Win11DebloatConfig.json

- name: Extract Win11Debloat suite
  ansible.windows.win_powershell:
    script: |
      $zip = "C:\Temp\Debloat\Win11Debloat.zip"
      $dest = "C:\Temp\Debloat\Win11Debloat"
      if (-not (Test-Path "$dest\Win11Debloat.ps1")) {
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $Ansible.Changed = $true
      } else {
          $Ansible.Changed = $false
      }

- name: Execute Win11Debloat app removal for AllUsers
  ansible.windows.win_powershell:
    script: |
      $cfgPath = "C:\Temp\Debloat\CustomDebloatConfig.json"
      $cfgJson = Get-Content $cfgPath -Raw | ConvertFrom-Json
      $patterns = @($cfgJson.Apps)

      $hasProv = $false
      try {
          $allProv = @(Get-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue)
          foreach ($pkg in $allProv) {
              foreach ($pat in $patterns) {
                  if ($pkg.PackageName -like "*$pat*") {
                      $hasProv = $true
                      break
                  }
              }
              if ($hasProv) { break }
          }
      } catch {
          $hasProv = $true
      }

      $debloatScript = "C:\Temp\Debloat\Win11Debloat\Win11Debloat.ps1"
      & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $debloatScript `
          -Silent `
          -CLI `
          -NoRestartExplorer `
          -SkipRegistryBackup `
          -RemoveApps `
          -Config $cfgPath `
          -AppRemovalTarget "AllUsers"
      $Ansible.Changed = $hasProv

- name: Execute Win11Debloat app removal for target user profile
  ansible.windows.win_powershell:
    script: |
      $cfgPath = "C:\Temp\Debloat\CustomDebloatConfig.json"
      $cfgJson = Get-Content $cfgPath -Raw | ConvertFrom-Json
      $patterns = @($cfgJson.Apps)

      $hasUserPkgs = $false
      try {
          $userAccount = New-Object System.Security.Principal.NTAccount("{{ ansible_user }}")
          $userSid = $userAccount.Translate([System.Security.Principal.SecurityIdentifier]).Value
          $allUserPkgs = @(Get-AppxPackage -User $userSid -ErrorAction SilentlyContinue)
          foreach ($pkg in $allUserPkgs) {
              foreach ($pat in $patterns) {
                  if ($pkg.Name -like "*$pat*") {
                      $hasUserPkgs = $true
                      break
                  }
              }
              if ($hasUserPkgs) { break }
          }
      } catch {
          $hasUserPkgs = $true
      }

      $debloatScript = "C:\Temp\Debloat\Win11Debloat\Win11Debloat.ps1"
      & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $debloatScript `
          -Silent `
          -CLI `
          -NoRestartExplorer `
          -SkipRegistryBackup `
          -RemoveApps `
          -Config $cfgPath `
          -AppRemovalTarget "{{ ansible_user }}"
      $Ansible.Changed = $hasUserPkgs

- name: Uninstall Microsoft OneDrive
  ansible.windows.win_powershell:
    script: |
      $proc = Get-Process -Name "OneDrive" -ErrorAction SilentlyContinue
      if ($proc) { Stop-Process -Name "OneDrive" -Force -ErrorAction SilentlyContinue }

      $setupPaths = @(
          "$env:SYSTEMROOT\SysWOW64\OneDriveSetup.exe",
          "$env:SYSTEMROOT\System32\OneDriveSetup.exe",
          "$env:LOCALAPPDATA\Microsoft\OneDrive\Update\OneDriveSetup.exe"
      )
      $hasSetup = @($setupPaths | Where-Object { Test-Path $_ })
      $runKey = (Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "OneDrive" -ErrorAction SilentlyContinue) -or (Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "OneDriveSetup" -ErrorAction SilentlyContinue)
      $oneDrivePol = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive"
      $polVal = (Get-ItemProperty -Path $oneDrivePol -Name "DisableFileSyncNGSC" -ErrorAction SilentlyContinue).DisableFileSyncNGSC

      if (-not $proc -and $hasSetup.Count -eq 0 -and -not $runKey -and ($polVal -eq 1)) {
          $Ansible.Changed = $false
          return
      }

      $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
      if (-not $winget) {
          $candidates = @(
              Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\winget.exe",
              "C:\Program Files\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\winget.exe"
          )
          foreach ($c in $candidates) {
              $found = Resolve-Path $c -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $winget = $found.Path; break }
          }
      }
      if ($winget -and (Test-Path $winget)) {
          & $winget uninstall --id Microsoft.OneDrive -e --silent --disable-interactivity --accept-source-agreements 2>$null | Out-Null
      }

      foreach ($setup in $hasSetup) {
          Start-Process -FilePath $setup -ArgumentList "/uninstall" -Wait -NoNewWindow -ErrorAction SilentlyContinue
      }

      Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "OneDrive" -ErrorAction SilentlyContinue
      Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "OneDriveSetup" -ErrorAction SilentlyContinue

      if (-not (Test-Path $oneDrivePol)) { New-Item -Path $oneDrivePol -Force | Out-Null }
      Set-ItemProperty -Path $oneDrivePol -Name "DisableFileSyncNGSC" -Value 1 -Type DWord -Force

      $Ansible.Changed = $true
  failed_when: false

