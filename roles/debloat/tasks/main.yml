---
# ---------------------------------------------------------
# Telemetry & Diagnostics
# ---------------------------------------------------------
- name: Disable Windows Telemetry via Policy
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection
    name: AllowTelemetry
    data: 0
    type: dword

- name: Disable Telemetry and Diagnostic Services
  ansible.windows.win_service:
    name: "{{ item }}"
    start_mode: disabled
    state: stopped
  loop:
    - DiagTrack
    - dmwappushservice
  failed_when: false

# ---------------------------------------------------------
# Start Menu & Search Tweaks
# ---------------------------------------------------------
- name: Disable Bing web results in Start Menu search
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - { path: "HKCU:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer", name: "DisableSearchBoxSuggestions", data: 1 }
    - { path: "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search", name: "BingSearchEnabled", data: 0 }

- name: Hide Search bar on Taskbar
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Search
    name: SearchboxTaskbarMode
    data: 0
    type: dword

- name: Disable Start Menu suggestions and promoted app recommendations
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
    name: "{{ item }}"
    data: 0
    type: dword
  loop:
    - SystemPaneSuggestionsEnabled
    - SubscribedContent-338388Enabled
    - SubscribedContent-338389Enabled
    - SubscribedContent-353694Enabled
    - SubscribedContent-353696Enabled

- name: Disable Lockscreen tips and advertisements
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
    name: "{{ item }}"
    data: 0
    type: dword
  loop:
    - RotatingLockScreenOverlayEnabled
    - SubscribedContent-338387Enabled

# ---------------------------------------------------------
# Explorer & UI Enhancements
# ---------------------------------------------------------
- name: Always show known file extensions in File Explorer
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
    name: HideFileExt
    data: 0
    type: dword

- name: Restore classic Windows 10 full context menu
  ansible.windows.win_regedit:
    path: HKCU:\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32
    name: "(Default)"
    data: ""
    type: string

- name: Disable Windows Copilot
  ansible.windows.win_regedit:
    path: "{{ item }}"
    name: TurnOffWindowsCopilot
    data: 1
    type: dword
  loop:
    - HKCU:\Software\Policies\Microsoft\Windows\WindowsCopilot
    - HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot

# ---------------------------------------------------------
# AI Features & Recall Disabling
# ---------------------------------------------------------
- name: Disable Windows Recall, AI Snapshots, and Click-To-Do
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - { path: "HKCU:\\Software\\Policies\\Microsoft\\Windows\\WindowsAI", name: "DisableAIDataAnalysis", data: 1 }
    - { path: "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsAI", name: "DisableAIDataAnalysis", data: 1 }
    - { path: "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsAI", name: "AllowRecallEnablement", data: 0 }
    - { path: "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsAI", name: "TurnOffSavingSnapshots", data: 1 }
    - { path: "HKCU:\\Software\\Policies\\Microsoft\\Windows\\WindowsAI", name: "DisableClickToDo", data: 1 }
    - { path: "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsAI", name: "DisableClickToDo", data: 1 }

- name: Disable Microsoft Edge AI and Copilot features
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Edge
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - { name: "CopilotCDPPageContext", data: 0 }
    - { name: "CopilotPageContext", data: 0 }
    - { name: "HubsSidebarEnabled", data: 0 }
    - { name: "EdgeEntraCopilotPageContext", data: 0 }
    - { name: "EdgeHistoryAISearchEnabled", data: 0 }
    - { name: "ComposeInlineEnabled", data: 0 }
    - { name: "NewTabPageBingChatEnabled", data: 0 }
    - { name: "ShowRecommendationsEnabled", data: 0 }
    - { name: "EdgeShoppingAssistantEnabled", data: 0 }

- name: Disable Notepad AI features
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\WindowsNotepad
    name: DisableAIFeatures
    data: 1
    type: dword

- name: Disable Paint AI features
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint
    name: "{{ item }}"
    data: 1
    type: dword
  loop:
    - DisableCocreator
    - DisableGenerativeFill
    - DisableImageCreator
    - DisableGenerativeErase
    - DisableRemoveBackground

# ---------------------------------------------------------
# Advanced Explorer, Taskbar & System Tweaks
# ---------------------------------------------------------
- name: Enable End Task option on Taskbar right-click
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings
    name: TaskbarEndTask
    data: 1
    type: dword

- name: Hide OneDrive from File Explorer Navigation Pane
  ansible.windows.win_regedit:
    path: HKCU:\Software\Classes\CLSID\{018D5C66-4533-4307-9B53-224DE2ED1FE6}
    name: System.IsPinnedToNameSpaceTree
    data: 0
    type: dword

- name: Hide duplicate removable drives from File Explorer Navigation Pane
  ansible.windows.win_regedit:
    path: "{{ item }}"
    state: absent
  loop:
    - HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\DelegateFolders\{F5FB2C77-0E2F-4A16-A381-3E560C68BC83}
    - HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\DelegateFolders\{F5FB2C77-0E2F-4A16-A381-3E560C68BC83}

- name: Disable Fast Startup (ensure clean reboot)
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power
    name: HiberbootEnabled
    data: 0
    type: dword

- name: Prevent automatic reboot after Windows Update while signed in
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: NoAutoRebootWithLoggedOnUsers
    data: 1
    type: dword

- name: Disable Game DVR and Game Bar background recording
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - { path: "HKCU:\\System\\GameConfigStore", name: "GameDVR_Enabled", data: 0 }
    - { path: "HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\GameDVR", name: "AppCaptureEnabled", data: 0 }
    - { path: "HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\GameDVR", name: "AllowGameDVR", data: 0 }
    - { path: "HKCU:\\SOFTWARE\\Microsoft\\GameBar", name: "UseNexusForGameBarEnabled", data: 0 }

- name: Disable Delivery Optimization (P2P Windows update sharing)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization
    name: DODownloadMode
    data: 0
    type: dword

- name: Disable Find My Device location tracking
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\FindMyDevice
    name: AllowFindMyDevice
    data: 0
    type: dword

- name: Disable Xbox background services
  ansible.windows.win_service:
    name: "{{ item }}"
    start_mode: disabled
    state: stopped
  loop:
    - XblAuthManager
    - XblGameSave
    - XboxGipSvc
    - XboxNetApiSvc
  failed_when: false

- name: Uninstall Microsoft OneDrive
  ansible.windows.win_powershell:
    script: |
      $proc = Get-Process -Name "OneDrive" -ErrorAction SilentlyContinue
      if ($proc) { Stop-Process -Name "OneDrive" -Force -ErrorAction SilentlyContinue }

      # Uninstall via winget if registered
      $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
      if (-not $winget) { $winget = "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe" }
      if ($winget -and (Test-Path $winget)) {
          & $winget uninstall --id Microsoft.OneDrive -e --silent --accept-source-agreements 2>$null | Out-Null
      }

      # Run native uninstaller
      $setupPaths = @(
          "$env:SYSTEMROOT\SysWOW64\OneDriveSetup.exe",
          "$env:SYSTEMROOT\System32\OneDriveSetup.exe",
          "$env:LOCALAPPDATA\Microsoft\OneDrive\Update\OneDriveSetup.exe"
      )
      foreach ($setup in $setupPaths) {
          if (Test-Path $setup) {
              Start-Process -FilePath $setup -ArgumentList "/uninstall" -Wait -NoNewWindow -ErrorAction SilentlyContinue
          }
      }

      # Remove startup keys and prevent reinstallation
      Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "OneDrive" -ErrorAction SilentlyContinue
      Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "OneDriveSetup" -ErrorAction SilentlyContinue

      $oneDrivePol = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\OneDrive"
      if (-not (Test-Path $oneDrivePol)) { New-Item -Path $oneDrivePol -Force | Out-Null }
      Set-ItemProperty -Path $oneDrivePol -Name "DisableFileSyncNGSC" -Value 1 -Type DWord -Force

      $Ansible.Changed = $true

# ---------------------------------------------------------
# Bloatware App Removal (UWP / Appx)
# ---------------------------------------------------------
- name: Remove bloatware Appx and Provisioned packages
  ansible.windows.win_powershell:
    parameters:
      AppList: "{{ bloatware_apps }}"
    script: |
      $apps = $using:AppList
      $changed = $false

      $allProvisioned = Get-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue
      $currentUserInstalled = Get-AppxPackage -ErrorAction SilentlyContinue
      $allInstalled = try { Get-AppxPackage -AllUsers -ErrorAction SilentlyContinue } catch { $null }

      foreach ($app in $apps) {
          # 1. Match and remove currently installed packages for the CURRENT user
          $userMatches = $currentUserInstalled | Where-Object { $_.Name -like "*$app*" -or $_.PackageFullName -like "*$app*" }
          if ($userMatches) {
              foreach ($pkg in $userMatches) {
                  Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction SilentlyContinue | Out-Null
                  $changed = $true
              }
          }

          # 2. Match and remove currently installed packages for ALL users
          if ($allInstalled) {
              $instMatches = $allInstalled | Where-Object { $_.Name -like "*$app*" -or $_.PackageFullName -like "*$app*" }
              if ($instMatches) {
                  foreach ($pkg in $instMatches) {
                      Remove-AppxPackage -Package $pkg.PackageFullName -AllUsers -ErrorAction SilentlyContinue | Out-Null
                      $changed = $true
                  }
              }
          }

          # 3. Match and remove provisioned packages (so new profiles and updates never get them)
          $provMatches = $allProvisioned | Where-Object { $_.DisplayName -like "*$app*" -or $_.PackageName -like "*$app*" }
          if ($provMatches) {
              foreach ($pkg in $provMatches) {
                  Remove-AppxProvisionedPackage -Online -PackageName $pkg.PackageName -ErrorAction SilentlyContinue | Out-Null
                  $changed = $true
              }
          }
      }

      $Ansible.Changed = $changed

- name: Ensure stubborn built-in apps are removed via winget
  ansible.windows.win_powershell:
    script: |
      $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
      if (-not $winget) { $winget = "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe" }
      if (-not $winget -or -not (Test-Path $winget)) { return }

      $stubbornApps = @(
          "Microsoft.Teams",
          "Microsoft.OutlookForWindows",
          "Microsoft.Todos",
          "Clipchamp.Clipchamp",
          "Microsoft.WindowsFeedbackHub",
          "Microsoft.WindowsSoundRecorder",
          "Microsoft.MicrosoftSolitaireCollection",
          "Microsoft.BingNews",
          "Microsoft.ZuneMusic",
          "Microsoft.Windows.Photos",
          "Microsoft.GamingApp",
          "Microsoft.XboxApp",
          "Microsoft.Copilot"
      )

      foreach ($app in $stubbornApps) {
          $check = & $winget list --id $app --exact --accept-source-agreements 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -and ($check -match [regex]::Escape($app))) {
              Write-Host "Removing $app via winget..."
              & $winget uninstall --id $app -e --silent --accept-source-agreements 2>&1 | Out-Null
              $Ansible.Changed = $true
          }
      }
  failed_when: false

