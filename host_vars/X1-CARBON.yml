---
# ------------------------------------------------------------------------------
# Host-Specific Configuration: ThinkPad X1 Carbon (Secondary Laptop)
# ------------------------------------------------------------------------------

# Profile: 'core' (minimal) or 'full' (all workstation tools)
install_profile: "full"

# Hardware / Accessory integrations
enable_canon_scanner: true
touchpad_scroll_direction: 4294967295  # Down motion scrolls down

# ThinkPad Hardware Tweaks (X1-CARBON only)
enable_lenovo_battery_gauge: true

# Internal OLED Display Scaling (200% for 2880x1800 14" panel, leaves external Dell at 100%)
internal_display_scaling: 200

# Package overrides (X1-CARBON keeps full workstation suite)
extra_packages: []
exclude_packages: []
uninstall_packages: []
