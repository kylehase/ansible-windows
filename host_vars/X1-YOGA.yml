---
# ------------------------------------------------------------------------------
# Host-Specific Configuration: ThinkPad X1 Yoga (Primary Laptop)
# ------------------------------------------------------------------------------

# Profile: 'core' (minimal) or 'full' (all workstation tools)
install_profile: "full"

# Hardware / Accessory integrations
enable_canon_scanner: false
touchpad_scroll_direction: 4294967295  # Down motion scrolls down

# Display scaling (250% scale instead of default 300%)
display_scaling: 250

# Package overrides (inherits defaults from roles/packages/defaults/main.yml)
# extra_packages: []
# exclude_packages: []
# uninstall_packages: []

