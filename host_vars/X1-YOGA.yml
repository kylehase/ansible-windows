---
# ------------------------------------------------------------------------------
# Host-Specific Configuration: ThinkPad X1 Yoga (Primary Laptop)
# ------------------------------------------------------------------------------

# Profile: 'core' (minimal) or 'full' (all workstation tools)
install_profile: "full"

# Hardware / Accessory integrations
apply_dell_icc_profile: false
enable_canon_scanner: false
touchpad_scroll_direction: 4294967295  # Down motion scrolls down

# Display scaling (250% scale instead of default 300%)
display_scaling: 250

# Package overrides
# Add additional winget package IDs specific to this laptop:
extra_packages: []

# Exclude packages from installation on X1-YOGA:
exclude_packages:
  - Oracle.VirtualBox
  - Audacity.Audacity
  - Logitech.CameraSettings
  - Docker.DockerDesktop
  - Canva.Affinity
  - Dell.DisplayAndPeripheralManager
  - Git.Git
  - HandBrake.HandBrake
  - RedHat.VirtViewer
  - Meltytech.Shotcut
  - KDE.digiKam
  - darktable.darktable
  - Apple.Bonjour
  - Google.AndroidStudio
  - WinSCP.WinSCP
  - Tweaking4All.RenameMyTVSeries

# Actively uninstall/remove if currently present on X1-YOGA:
uninstall_packages: []

