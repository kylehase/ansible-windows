---
- name: Run Automated Verification Tests on Windows Workstation
  hosts: windows
  gather_facts: false

  tasks:
    # ---------------------------------------------------------
    # System Tweaks Tests
    # ---------------------------------------------------------
    - name: "[TEST] Verify Timezone auto-update registry setting"
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\tzautoupdate
        name: Start
      register: tz_stat
      failed_when: not tz_stat.exists or tz_stat.value != 3

    - name: "[TEST] Verify W32Time service is set to auto-start"
      ansible.windows.win_service:
        name: W32Time
      register: time_svc
      failed_when: time_svc.start_mode != "auto"

    - name: "[TEST] Verify ISO Date format in Registry"
      ansible.windows.win_reg_stat:
        path: HKCU:\Control Panel\International
        name: sShortDate
      register: date_stat
      failed_when: not date_stat.exists or date_stat.value != "yyyy-MM-dd"

    - name: "[TEST] Verify 24-hour Time format in Registry"
      ansible.windows.win_reg_stat:
        path: HKCU:\Control Panel\International
        name: sShortTime
      register: time_stat
      failed_when: not time_stat.exists or time_stat.value != "HH:mm"

    - name: "[TEST] Verify Touchpad scroll direction is set (Down motion scrolls down)"
      ansible.windows.win_reg_stat:
        path: HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\PrecisionTouchPad
        name: ScrollDirection
      register: touchpad_stat
      failed_when: not touchpad_stat.exists or touchpad_stat.value != 4294967295

    - name: "[TEST] Verify Touchpad lower right corner right-click is disabled"
      ansible.windows.win_reg_stat:
        path: HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\PrecisionTouchPad
        name: RightClickZoneEnabled
      register: tp_corner_stat
      failed_when: not tp_corner_stat.exists or tp_corner_stat.value != 0

    - name: "[TEST] Verify Desktop Recycle Bin icon is shown"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel
        name: "{645FF040-5081-101B-9F08-00AA002F954E}"
      register: rbin_stat
      failed_when: not rbin_stat.exists or rbin_stat.value != 0

    - name: "[TEST] Verify Desktop This PC icon is hidden"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel
        name: "{20D04FE0-3AEA-1069-A2D8-08002B30309D}"
      register: thispc_stat
      failed_when: not thispc_stat.exists or thispc_stat.value != 1

    - name: "[TEST] Verify Dark Mode is enabled for System and Apps"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
        name: "{{ item }}"
      register: dark_mode_stat
      loop:
        - SystemUsesLightTheme
        - AppsUseLightTheme
      failed_when: not dark_mode_stat.exists or dark_mode_stat.value != 0

    - name: "[TEST] Verify File Explorer opens to This PC"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: LaunchTo
      register: launchto_stat
      failed_when: not launchto_stat.exists or launchto_stat.value != 1

    - name: "[TEST] Verify Full Path in Explorer Title Bar is enabled"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\CabinetState
        name: FullPath
      register: fullpath_stat
      failed_when: not fullpath_stat.exists or fullpath_stat.value != 1

    - name: "[TEST] Verify Hidden Files are set to show"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: Hidden
      register: hidden_stat
      failed_when: not hidden_stat.exists or hidden_stat.value != 1

    - name: "[TEST] Verify Taskbar Copilot and Chat buttons are hidden"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: "{{ item }}"
      register: taskbar_declutter_stat
      loop:
        - ShowCopilotButton
        - TaskbarMn
      failed_when: not taskbar_declutter_stat.exists or taskbar_declutter_stat.value != 0

    - name: "[TEST] Verify Sticky Keys prompt is disabled"
      ansible.windows.win_reg_stat:
        path: HKCU:\Control Panel\Accessibility\StickyKeys
        name: Flags
      register: sticky_stat
      failed_when: not sticky_stat.exists or sticky_stat.value != "506"

    - name: "[TEST] Verify Windows Update NoAutoRebootWithLoggedOnUsers is enabled"
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: NoAutoRebootWithLoggedOnUsers
      register: no_reboot_stat
      failed_when: not no_reboot_stat.exists or no_reboot_stat.value != 1

    - name: "[TEST] Verify Delivery Optimization is restricted to LAN mode"
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization
        name: DODownloadMode
      register: do_stat
      failed_when: not do_stat.exists or do_stat.value != 1

    - name: "[TEST] Verify Brother Network Printer and Port"
      when: enable_network_printer | default(true) | bool
      ansible.windows.win_powershell:
        script: |
          $p = Get-Printer -Name "{{ printer_name }}" -ErrorAction SilentlyContinue
          $port = Get-PrinterPort -Name "IP_{{ printer_ip }}" -ErrorAction SilentlyContinue
          if (-not $p) { throw "Printer '{{ printer_name }}' not found" }
          if (-not $port) { throw "Printer port 'IP_{{ printer_ip }}' not found" }

    - name: "[TEST] Verify only Chrome shortcut remains on Desktop"
      ansible.windows.win_powershell:
        script: |
          $userDesktop = "C:\Users\{{ ansible_user }}\Desktop"
          $publicDesktop = "C:\Users\Public\Desktop"
          $dirs = @($userDesktop, $publicDesktop)
          $badShortcuts = @()
          foreach ($d in $dirs) {
              if (Test-Path $d) {
                  $scs = Get-ChildItem -Path $d -File -ErrorAction SilentlyContinue |
                      Where-Object { $_.Extension -in @(".lnk", ".url") -and ($_.Name -notmatch "Chrome") }
                  $badShortcuts += $scs
              }
          }
          if ($badShortcuts.Count -gt 0) {
              throw "Unwanted desktop shortcuts found: $($badShortcuts.FullName -join ', ')"
          }

    # ---------------------------------------------------------
    # Debloat Tests
    # ---------------------------------------------------------
    - name: "[TEST] Verify Telemetry Policy is Disabled (0)"
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name: AllowTelemetry
      register: telem_stat
      failed_when: not telem_stat.exists or telem_stat.value != 0

    - name: "[TEST] Verify DiagTrack service is disabled"
      ansible.windows.win_service:
        name: DiagTrack
      register: diag_svc
      failed_when: diag_svc.start_mode != "disabled"

    - name: "[TEST] Verify Bing in Start Search is Disabled"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Search
        name: BingSearchEnabled
      register: bing_stat
      failed_when: not bing_stat.exists or bing_stat.value != 0

    - name: "[TEST] Verify Advertising ID is disabled"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo
        name: Enabled
      register: adv_stat
      failed_when: not adv_stat.exists or adv_stat.value != 0

    - name: "[TEST] Verify Diagnostic Tailored Experiences is disabled"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Privacy
        name: TailoredExperiencesWithDiagnosticDataEnabled
      register: tailored_stat
      failed_when: not tailored_stat.exists or tailored_stat.value != 0

    - name: "[TEST] Verify Windows 10 Classic Context Menu CLSID exists"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32
      register: ctx_stat
      failed_when: not ctx_stat.exists

    - name: "[TEST] Verify File Extensions are visible"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: HideFileExt
      register: ext_stat
      failed_when: not ext_stat.exists or ext_stat.value != 0

    - name: "[TEST] Verify Copilot is turned off"
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot
        name: TurnOffWindowsCopilot
      register: copilot_stat
      failed_when: not copilot_stat.exists or copilot_stat.value != 1

    - name: "[TEST] Verify Taskbar End Task is enabled"
      ansible.windows.win_reg_stat:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings
        name: TaskbarEndTask
      register: endtask_stat
      failed_when: not endtask_stat.exists or endtask_stat.value != 1

    - name: "[TEST] Verify AI Recall / Analysis is disabled"
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsAI
        name: DisableAIDataAnalysis
      register: recall_stat
      failed_when: not recall_stat.exists or recall_stat.value != 1

    - name: "[TEST] Verify Fast Startup is disabled"
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power
        name: HiberbootEnabled
      register: fastboot_stat
      failed_when: not fastboot_stat.exists or fastboot_stat.value != 0

    - name: "[TEST] Verify UCPD service is set to disabled"
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\UCPD
        name: Start
      register: ucpd_stat
      failed_when: ucpd_stat.exists and ucpd_stat.value != 4

    - name: "[TEST] Verify Windows Web Experience Pack (Widgets) is removed"
      ansible.windows.win_powershell:
        script: |
          $pkg = Get-AppxPackage -Name "*WebExperience*" -ErrorAction SilentlyContinue
          if ($pkg) { throw "WebExperience package is still installed" }

    - name: "[TEST] Verify Microsoft Store taskbar pinning is disabled in Policy"
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer
        name: NoPinningStoreToTaskbar
      register: store_pin_stat
      failed_when: not store_pin_stat.exists or store_pin_stat.value != 1

    - name: "[TEST] Verify Taskbar LayoutModification template exists"
      ansible.windows.win_stat:
        path: "C:\\Users\\Default\\AppData\\Local\\Microsoft\\Windows\\Shell\\LayoutModification.xml"
      register: layout_stat
      failed_when: not layout_stat.stat.exists

    - name: "[TEST] Verify desired Taskbar pinned shortcuts exist"
      ansible.windows.win_stat:
        path: "C:\\Users\\{{ ansible_user }}\\AppData\\Roaming\\Microsoft\\Internet Explorer\\Quick Launch\\User Pinned\\TaskBar\\{{ item }}"
      register: pin_stats
      loop:
        - "File Explorer.lnk"
        - "Google Chrome.lnk"
        - "Windows PowerShell.lnk"
      failed_when: not pin_stats.stat.exists

    # ---------------------------------------------------------
    # Tools & Shortcuts Tests
    # ---------------------------------------------------------
    - name: "[TEST] Verify Tools directory binaries exist"
      ansible.windows.win_stat:
        path: "C:\\Users\\{{ ansible_user }}\\Tools\\{{ item }}"
      register: tool_files
      loop:
        - winrar-extract.vbs
        - mac-kbd-copy-paste.exe
        - WinXCorners.exe
        - nircmd.exe
      failed_when: not tool_files.stat.exists

    - name: "[TEST] Verify Startup shortcuts exist"
      ansible.windows.win_stat:
        path: "C:\\Users\\{{ ansible_user }}\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\{{ item }}.lnk"
      register: startup_lnks
      loop:
        - WinXCorners
        - mac-kbd-copy-paste
      failed_when: not startup_lnks.stat.exists

    - name: "[TEST] Verify legacy volume-increment shortcut was removed"
      ansible.windows.win_stat:
        path: "C:\\Users\\{{ ansible_user }}\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\volume-increment_v2new.lnk"
      register: vol_lnk
      failed_when: vol_lnk.stat.exists

    - name: "[TEST] Verify PowerToys settings file exists and has enabled modules"
      ansible.windows.win_powershell:
        script: |
          $path = "C:\Users\{{ ansible_user }}\AppData\Local\Microsoft\PowerToys\settings.json"
          if (Test-Path $path) {
              $json = Get-Content $path -Raw -Encoding utf8 | ConvertFrom-Json
              if (-not $json.enabled) { throw "enabled property missing from PowerToys settings" }
          }


    - name: Summary
      ansible.builtin.debug:
        msg: "ALL UNIT & VERIFICATION TESTS PASSED SUCCESSFULLY!"
